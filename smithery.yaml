# Smithery configuration for android2rust
# https://smithery.ai
name: android2rust-mcp
version: "0.1.0"
description: "100% pure-Rust ADB & Fastboot GUI wrapper, device orchestrator, offline APK/.ab/SQLite forensics workstation, .a2r/.bat/.ps1/.sh exporter, and stdio MCP server"
repository: "https://github.com/adpaolucci/android2rust"
license: "Apache-2.0"

entrypoint:
  type: stdio
  command: android2rust-mcp

build:
  type: cargo
  crate: android2rust-mcp

tools:
  - name: android2rust_environment
    description: "Detect host OS, adb/fastboot binary availability, Android SDK paths, and configuration directory."
  - name: android2rust_presets
    description: "List built-in Android ADB, Fastboot, and offline forensic inspection presets."
  - name: android2rust_build_command
    description: "Build validated ADB/Fastboot commands plus optional .a2r, .bat, .ps1, .sh, and schtasks scripts."
  - name: android2rust_parse_command
    description: "Parse a raw adb/fastboot/inspect command line or .a2r recipe file into a structured validated job model."
  - name: android2rust_decode_status
    description: "Decode Android/ADB/Fastboot exit codes and status strings (e.g. INSTALL_FAILED_*, DEVICE_UNAUTHORIZED) into remediation guidance."
  - name: android2rust_profiles
    description: "List, inspect, save, or delete persistent Android2Rust job profiles."
  - name: android2rust_inspect_artifact
    description: "Perform pure-Rust offline forensic inspection of .apk (AXML/v1-v3.1/Janus/Zip-Slip), .ab (plain or PBKDF2/AES-256-CBC decrypted), Android 12+ ABX, bugreport .zip, SQLite .db (+ -wal/-shm/-journal), XML, directories, or text dumps."
  - name: android2rust_dry_run
    description: "Run a non-destructive pre-flight simulation and optional local artifact inspection (with optional case provenance and ab_password) without mutating connected devices."
  - name: android2rust_run
    description: "Execute an ADB, Fastboot, or forensic job (with optional case provenance and ab_password) enforcing strict confirmation checks for destructive operations."
  - name: android2rust_report
    description: "Generate self-contained offline HTML, JSON, Markdown, or chronological CSV/JSONL timeline audit reports from an artifact, log file, or validated dry-run job."
