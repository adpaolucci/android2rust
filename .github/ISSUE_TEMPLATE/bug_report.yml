name: Bug Report
description: Report a bug in the Win32 GUI, Iced GUI, CLI, Forensics Inspector, or MCP server
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component / Binary
      options:
        - android2rust-win32 (Native WinSafe Win32 GUI)
        - android2rust-iced (Cross-platform Iced GUI)
        - android2rust (CLI)
        - android2rust-mcp (MCP Server)
        - android2rust-core / runner / report
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System & Session Type
      options:
        - Windows 11
        - Windows 10
        - Windows Server / Hyper-V / VM over RDP
        - Linux (X11 / Wayland)
        - macOS (Apple Silicon / Intel)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or Commit Hash
      placeholder: "e.g., v0.1.0"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug, steps to reproduce, and expected vs. actual behavior.
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Generated ADB/Fastboot Command or Logs (Optional)
      description: Paste any command line or relevant error logs (sanitize sensitive serials/paths if needed).
      render: powershell
