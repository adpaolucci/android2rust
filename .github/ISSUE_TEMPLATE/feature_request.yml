name: Feature Request
description: Suggest a new ADB/Fastboot capability, forensic parser, preset, UI enhancement, or MCP tool
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Problem & Proposed Enhancement
      description: Describe the workflow gap or enhancement you would like to see.
    validations:
      required: true

  - type: textarea
    id: target
    attributes:
      label: Affected Surface(s)
      description: e.g., Win32 GUI, Iced GUI, CLI, Forensics Inspector, MCP Server, `.a2r` / Report Exporter.
